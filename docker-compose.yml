version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ops-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ops-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: ops-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql-data: